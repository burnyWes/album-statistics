<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#b91c1c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Alben" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Album-Statistics</title>
    <script>
      try {
        document.documentElement.dataset.invertedColors =
          localStorage.getItem('invertedColors') === 'true'
        document.documentElement.dataset.invertedButtons =
          localStorage.getItem('invertedButtons') === 'true'
      } catch (storageBlocked) {
        document.documentElement.dataset.invertedColors = 'false'
        document.documentElement.dataset.invertedButtons = 'false'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
